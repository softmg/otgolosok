<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Обновление · Отголосок</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/update.css">
    <script src="/update.js" defer></script>
  </head>
  <body>
    <main>
      <p class="wordmark"><span class="brand-mark">Отголосок<span aria-hidden="true">.</span></span></p>
      <h1>Открываем новую версию</h1>
      <p id="update-status" role="status">Загружаем обновление. Затем откроется первая история.</p>
      <button id="retry-update" type="button" hidden>Попробовать ещё раз</button>
      <a href="/#top">Вернуться к прогулке</a>
      <noscript><p>Для обновления включите JavaScript в настройках Safari.</p></noscript>
    </main>
  </body>
</html>
