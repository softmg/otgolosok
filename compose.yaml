services:
  frontend:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Leaves time for in-flight requests (20 s drain) and for requeueing an active job.
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      USER_DAILY_GENERATION_LIMIT: ${USER_DAILY_GENERATION_LIMIT:-6}
      WALK_ROUTER_URL: http://valhalla:8002/route
      WALK_OVERPASS_URL: ${WALK_OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ALLOW_LEGACY_ADMIN_TOKEN: ${ALLOW_LEGACY_ADMIN_TOKEN:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      STORY_MODEL: ${STORY_MODEL:-codex/gpt-5.6-sol-medium}
      WRITER_MODEL: ${WRITER_MODEL:-codex/gpt-5.6-sol-low}
      RESEARCH_SEARCH_MODEL: ${RESEARCH_SEARCH_MODEL:-}
      CONTENT_AUTO_APPROVE: ${CONTENT_AUTO_APPROVE:-false}
      CONTENT_WORKER_CONCURRENCY: ${CONTENT_WORKER_CONCURRENCY:-1}
      YANDEX_TTS_API_KEY: ${YANDEX_TTS_API_KEY:-}
      YANDEX_TTS_VOICE: ${YANDEX_TTS_VOICE:-marina}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-}
      PROMO_WALKS_TOKEN: ${PROMO_WALKS_TOKEN:-}
      WORKER_LEASE_SECRET: ${WORKER_LEASE_SECRET:-}
      LOCAL_TTS_ENGINE: ${LOCAL_TTS_ENGINE:-silero}
      LOCAL_TTS_TRANSPORT: ${LOCAL_TTS_TRANSPORT:-worker}
      TTS_API_URL: ${TTS_API_URL:-}
      TTS_API_TOKEN: ${TTS_API_TOKEN:-}
      SILERO_MODEL_SHA256: ${SILERO_MODEL_SHA256:-50081637b602126ee06cb3bc8a744d25651d2da149ee8864b9a379bfdd934437}
      SILERO_SPEAKER: ${SILERO_SPEAKER:-baya}
      F5_MODEL_SHA256: ${F5_MODEL_SHA256:-}
      F5_REFERENCE_ID: ${F5_REFERENCE_ID:-}
      F5_CONFIG_SHA256: ${F5_CONFIG_SHA256:-}
      F5_REFERENCE_SHA256: ${F5_REFERENCE_SHA256:-}
      F5_MINIMUM_PUBLICATION_DURATION_SEC: ${F5_MINIMUM_PUBLICATION_DURATION_SEC:-30}
      AIROUTER_LOGS_ENDPOINT: ${AIROUTER_LOGS_ENDPOINT:-https://airouter.softmg.tech}
      AIROUTER_LOGS_TOKEN: ${AIROUTER_LOGS_TOKEN:-}
    volumes:
      - backend_data:/data
    depends_on:
      valhalla:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/story-service',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    environment:
      tile_urls: ${VALHALLA_TILE_URL:-https://download.bbbike.org/osm/bbbike/Moscow/Moscow.osm.pbf}
      use_tiles_ignore_pbf: "True"
      build_tar: "True"
      serve_tiles: "True"
      server_threads: ${VALHALLA_THREADS:-2}
      build_elevation: "False"
      build_admins: "False"
      build_time_zones: "False"
      build_transit: "False"
      use_default_speeds_config: "False"
    volumes:
      - valhalla_data:/custom_files
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8002/status"]
      interval: 30s
      timeout: 10s
      start_period: 1h
      retries: 3
    restart: unless-stopped

volumes:
  backend_data:
  valhalla_data:
