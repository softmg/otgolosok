# Query strings can contain location data and private research recovery tokens.
log_format api_private '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    # Behind another HTTPS proxy, $remote_addr is that proxy and every user
    # shares one Better Auth rate-limit bucket. Trust its address explicitly:
    #   set_real_ip_from <proxy address or subnet>;
    #   real_ip_header X-Forwarded-For;
    #   real_ip_recursive on;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # JSON bodies are at most ~110 KB (walk documents); the backend enforces
    # tighter per-endpoint limits, auth forms included (16 KiB).
    location /api/ {
        client_max_body_size 128k;
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Story audio is content-addressed (<sha256>.mp3): keep the backend's
    # immutable Cache-Control instead of the /api/ no-store.
    location /api/story-audio/ {
        include /etc/nginx/snippets/api-proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Place photos synced from Wikimedia Commons are content-addressed (<sha256>.jpg) too.
    location /api/place-images/ {
        include /etc/nginx/snippets/api-proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The public map index and published place texts carry content-addressed
    # ETags and no private data (a cell is a 1° square, not a user location):
    # keep the backend's "Cache-Control: no-cache" so browsers revalidate with 304.
    location /api/content/map-cells {
        include /etc/nginx/snippets/api-proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ "^/api/content/places/osm:" {
        include /etc/nginx/snippets/api-proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Only local TTS workers upload audio (backend/audio-ingest.mjs: up to 64 MiB).
    location ~ "^/api/worker/v1/jobs/[0-9a-fA-F-]{36}/result$" {
        client_max_body_size 64m;
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Published walk recordings carry a content hash in the name (slug-<12 hex>.mp3).
    location ~ "^/audio/.+-[0-9a-f]{12}\.mp3$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Editorial place photos carry a content hash in the name (<type>-<id>-<12 hex>.jpg).
    location ~ "^/images/places/[a-z0-9-]+-[0-9a-f]{12}\.jpg$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The single-story page was replaced by the map: old links and bookmarks
    # (/create?job=<id>) open the same story there.
    location ~ "^/create(?:\.html|/)?$" {
        include /etc/nginx/snippets/security-headers.conf;
        return 301 /$is_args$args;
    }

    location / {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri.html $uri/ =404;
    }
}
