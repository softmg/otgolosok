# Included in every location: a location-level add_header drops inherited ones.
# Script, style and connect rules live in each page's <meta> policy with
# per-page inline script hashes (scripts/build-content-security-policy.mjs).
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
